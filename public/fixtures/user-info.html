<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Complete your profile</title>
  <script>
    window.__mutated = false;
    window.__submitted = false;
    document.addEventListener("input", function () { window.__mutated = true; }, true);
    document.addEventListener("click", function (event) {
      var el = event.target.closest("a,button");
      if (!el) return;
      var label = (el.innerText || el.value || "").replace(/\s+/g, " ").trim();
      if (label === "Submit application" || label === "Submit" || label === "Save") window.__submitted = true;
    }, true);
  </script>
</head>
<body>
  <h1>Complete your profile</h1>
  <p>This profile wizard is not a job application.</p>
  <form autocomplete="off">
    <label>Display name <input name="display" required /></label>
    <p><a href="thanks.html">Submit application</a></p>
  </form>
</body>
</html>
