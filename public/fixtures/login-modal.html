<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sample role</title>
  <script>
    window.__mutated = false;
    window.__submitted = false;
    document.addEventListener("input", function () { window.__mutated = true; }, true);
  </script>
</head>
<body>
  <h1>Sample role</h1>
  <p><button type="button" id="apply">立即投递</button></p>
  <div class="modal" id="login" hidden>
    <p>立即登录</p>
    <label>验证码 <input name="code" /></label>
    <button type="button">获取验证码</button>
  </div>
  <script>
    document.getElementById("apply").addEventListener("click", function () {
      document.getElementById("login").hidden = false;
    });
  </script>
</body>
</html>
