<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sample role</title>
  <script>
    window.__mutated = false;
    window.__submitted = false;
    document.addEventListener("input", function () { window.__mutated = true; }, true);
    document.addEventListener("click", function (event) {
      var el = event.target.closest("a,button");
      if (!el) return;
      var label = (el.innerText || el.value || "").replace(/\s+/g, " ").trim();
      if (label === "Submit application" || label === "Submit" || label === "Save") window.__submitted = true;
    }, true);
  </script>
</head>
<body>
  <header>
    <input type="search" name="q" placeholder="Search roles" />
  </header>
  <h1>Sample role</h1>
  <p>Sample city</p>
  <p><a href="thanks.html">Submit application</a></p>
  <p><a id="apply" href="form.html">Apply now</a></p>
</body>
</html>
