<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign in</title>
  <script>
    window.__mutated = false;
    window.__submitted = false;
    document.addEventListener("input", function () { window.__mutated = true; }, true);
    document.addEventListener("click", function (event) {
      var el = event.target.closest("a,button");
      if (!el) return;
      var label = (el.innerText || el.value || "").replace(/\s+/g, " ").trim();
      if (label === "Submit application" || label === "Submit" || label === "Save" || label === "Continue") window.__submitted = true;
    }, true);
  </script>
</head>
<body>
  <h1>Sign in</h1>
  <form autocomplete="off">
    <label>Email or phone <input type="email" name="account" /></label>
    <label>Password <input type="password" name="password" /></label>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
