<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Measurement Strategist - Apple</title>
  <script>
    window.__mutated = false;
    window.__submitted = false;
    document.addEventListener("input", function () { window.__mutated = true; }, true);
    document.addEventListener("click", function (event) {
      var el = event.target.closest("a,button");
      if (!el) return;
      var label = (el.innerText || el.value || "").replace(/\s+/g, " ").trim();
      if (label === "提交申请" || label === "提交" || label === "保存") window.__submitted = true;
    }, true);
  </script>
</head>
<body>
  <h1>Measurement Strategist (Data Analyst) - Apple Ads, Greater China</h1>
  <p>Shanghai, Shanghai, China</p>
  <p><a href="thanks.html">提交申请</a></p>
  <p><a id="apply" href="form.html">提交简历</a></p>
</body>
</html>
