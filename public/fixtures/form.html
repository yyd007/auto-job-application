<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Application form</title>
  <script>
    window.__mutated = false;
    window.__submitted = false;
    document.addEventListener("input", function () { window.__mutated = true; }, true);
    document.addEventListener("click", function (event) {
      var el = event.target.closest("a,button");
      if (!el) return;
      var label = (el.innerText || el.value || "").replace(/\s+/g, " ").trim();
      if (label === "Submit application" || label === "Submit" || label === "Save") window.__submitted = true;
    }, true);
  </script>
</head>
<body>
  <h1>Application</h1>
  <form autocomplete="off">
    <p><a href="thanks.html">Submit application</a></p>
    <label>Last name <input name="family" required /></label>
    <label>First name <input name="given" required /></label>
    <label>Phone <input name="phone" type="tel" required /></label>
    <label>Email <input name="email" type="email" required /></label>
    <div>
      <label for="verified">Preferred email</label>
      <input id="verified" name="verifiedEmail" type="email" value="kept@example.com" readonly />
      <span>Verified</span>
    </div>
    <label>Country
      <select name="country" required>
        <option value="">Select</option>
        <option>Your country</option>
        <option>Other country</option>
      </select>
    </label>
    <label>State / Province <input name="region" required /></label>
    <label>City <input name="city" required /></label>
    <label>Postal code <input name="postal" required /></label>
    <label>District (optional) <input name="district" /></label>
    <label>Gender
      <select name="gender" required>
        <option value="">Select</option>
        <option>Your gender</option>
        <option>Another answer</option>
      </select>
    </label>
    <fieldset>
      <legend>Are you at least 18?</legend>
      <label><input type="radio" name="age" value="Yes" required /> Yes</label>
      <label><input type="radio" name="age" value="No" /> No</label>
    </fieldset>
    <fieldset>
      <legend>Are you authorized to work?</legend>
      <label><input type="radio" name="auth" value="Yes" required /> Yes</label>
      <label><input type="radio" name="auth" value="No" /> No</label>
    </fieldset>
    <fieldset>
      <legend>Do you need visa sponsorship?</legend>
      <label><input type="radio" name="visa" value="Yes" required /> Yes</label>
      <label><input type="radio" name="visa" value="No" /> No</label>
    </fieldset>
    <fieldset>
      <legend>Have you worked at your employer?</legend>
      <label><input type="radio" name="custom" value="Yes" required /> Yes</label>
      <label><input type="radio" name="custom" value="No" /> No</label>
    </fieldset>
    <label>Skills <textarea name="skills" required></textarea></label>
    <label>Job description (Your employer) <textarea name="role" required></textarea></label>
    <label>Your language proficiency
      <select name="language" required>
        <option value="">Select</option>
        <option>Basic</option>
        <option>Fluent</option>
      </select>
    </label>
    <label>Expected pay <input name="pay" required /></label>
  </form>
</body>
</html>
